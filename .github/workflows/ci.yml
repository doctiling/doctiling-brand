name: gate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run gate
      - name: panel
        if: always()
        run: node scripts/panel/generar.mjs --salida "${{ runner.temp }}/panel"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel-del-arnes
          path: ${{ runner.temp }}/panel
